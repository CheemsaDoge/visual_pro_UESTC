<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>网络设置</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #151518;
      --accent: #ff9500;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --status-ok: #32d74b;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: var(--bg); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .app-container { display: flex; flex-direction: column; height: 100vh; }
    
    .header {
      display: flex; align-items: center; height: 60px; padding: 0 16px; border-bottom: 2px solid rgba(255,255,255,0.08);
    }
    .back-btn { text-decoration: none; color: var(--accent); font-size: 32px; margin-right: 16px; font-weight: bold; }
    .header h2 { font-size: 22px; margin: 0; font-weight: 700; }

    .status-section { padding: 16px; }
    .status-card {
      background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 2px solid rgba(255,255,255,0.08);
    }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .status-row:last-child { margin-bottom: 0; }
    .label { color: var(--text-muted); font-size: 15px; font-weight: 600; }
    .value { font-size: 16px; font-weight: 600; color: #eee; }
    .connected-ssid { color: var(--status-ok); font-weight: 700; }

    .list-section { flex: 1; overflow-y: auto; padding: 0 16px 100px; }
    .list-header { 
      display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    .list-header span { font-size: 14px; color: var(--text-muted); font-weight: 700; }

    .wifi-item {
      display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .wifi-info { flex: 1; min-width: 0; padding-right: 12px; }
    .wifi-name { font-size: 18px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wifi-meta { font-size: 14px; color: var(--text-muted); font-weight: 500; }

    .btn-sm {
      padding: 10px 20px; border-radius: 20px; border: none; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-connect { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .btn-disconnect { background: rgba(255,69,58,0.2); color: #ff453a; border: 1px solid rgba(255,69,58,0.2); }

    .footer-actions {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 16px; background: linear-gradient(to top, var(--bg) 85%, transparent);
    }
    .btn-primary {
      width: 100%; height: 60px; border-radius: 30px; background: var(--accent); color: #000; border: none;
      font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-content {
      width: 100%; background: #1c1c1e; border-radius: 20px; padding: 24px; border: 2px solid rgba(255,255,255,0.1);
    }
    .modal h3 { margin: 0 0 16px; font-size: 22px; font-weight: 700; }
    .pwd-input {
      width: 100%; height: 50px; background: #2c2c2e; border: 2px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 0 16px; color: #fff; font-size: 18px; margin-bottom: 20px; outline: none;
    }
    .modal-btns { display: flex; gap: 12px; }
    .modal-btns button { flex: 1; height: 50px; border-radius: 25px; border: none; font-weight: 700; font-size: 16px; }
    .btn-cancel { background: #3a3a3c; color: #fff; }
    .btn-submit { background: var(--accent); color: #000; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <a href="index.html" class="back-btn">←</a>
      <h2>网络设置</h2>
    </header>

    <div class="status-section">
      <div class="status-card">
        <div class="status-row">
          <span class="label">当前连接</span>
          <span id="wifi-status" class="value connected-ssid">读取中...</span>
        </div>
        <div class="status-row">
          <span class="label">IP 地址</span>
          <span id="ip-status" class="value">--</span>
        </div>
      </div>
    </div>

    <div class="list-section">
      <div class="list-header">
        <span>可用网络</span>
        <span id="scan-status">更新中</span>
      </div>
      <div id="wifi-list"></div>
    </div>

    <div class="footer-actions">
      <button id="btn-scan" class="btn-primary" onclick="scanWifi()">扫描热点</button>
    </div>
  </div>

  <div id="pwd-modal" class="modal">
    <div class="modal-content">
      <h3 id="pwd-ssid">输入密码</h3>
      <input id="pwd-input" type="password" class="pwd-input" placeholder="Wi-Fi 密码" />
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closePwd()">取消</button>
        <button class="btn-submit" onclick="submitPwd()">连接</button>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let pendingService = '', pendingSsid = '';

    async function fetchJson(url, options = {}) {
      try {
        options.cache = 'no-store';
        const resp = await fetch(url, options);
        return await resp.json();
      } catch (e) { return { ok: false, msg: '网络错误' }; }
    }

    async function updateStatus() {
      const data = await fetchJson('/api/status');
      if (data) {
        $('wifi-status').textContent = data.wifi || '未连接';
        $('ip-status').textContent = (data.ip_list && data.ip_list.length > 0) ? data.ip_list[0].ip : (data.ip || '--');
      }
    }

    async function scanWifi() {
      const btn = $('btn-scan');
      btn.disabled = true;
      btn.textContent = '扫描中...';
      $('scan-status').textContent = '正在扫描...';
      
      const data = await fetchJson('/api/wifi/scan', { method: 'POST' });
      renderList(data.services || []);
      
      btn.disabled = false;
      btn.textContent = '扫描热点';
      $('scan-status').textContent = '已更新';
      updateStatus();
    }

    async function refreshList() {
      const data = await fetchJson('/api/wifi/list');
      renderList(data.services || []);
      updateStatus();
    }

    function renderList(services) {
      const box = $('wifi-list');
      box.innerHTML = '';
      if (!services || services.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:16px;">未发现热点</div>';
        return;
      }

      services.forEach(item => {
        const div = document.createElement('div');
        div.className = 'wifi-item';
        div.innerHTML = `
          <div class="wifi-info">
            <div class="wifi-name">${item.name || '(隐藏)'}</div>
            <div class="wifi-meta">${item.security === 'open' ? '开放' : '加密'} • ${item.online ? '在线' : '离线'}</div>
          </div>
          <button class="btn-sm ${item.connected ? 'btn-disconnect' : 'btn-connect'}" type="button">
            ${item.connected ? '断开' : '连接'}
          </button>
        `;
        const btn = div.querySelector('button');
        btn.onclick = () => {
          if (item.connected) disconnect(item.service);
          else connect(item.service, item.security, item.name);
        };
        box.appendChild(div);
      });
    }

    function connect(service, security, ssid) {
      if (security === 'open') {
        doConnect(service, '');
      } else {
        pendingService = service;
        pendingSsid = ssid;
        $('pwd-ssid').textContent = ssid;
        $('pwd-input').value = '';
        $('pwd-modal').classList.add('show');
        $('pwd-input').focus();
      }
    }

    function closePwd() { $('pwd-modal').classList.remove('show'); }

    async function submitPwd() {
      const pwd = $('pwd-input').value;
      closePwd();
      doConnect(pendingService, pwd);
    }

    async function doConnect(service, passphrase) {
      $('scan-status').textContent = '正在连接...';
      const data = await fetchJson('/api/wifi/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ service, passphrase })
      });
      alert(data.ok ? '连接请求已发出' : '连接失败: ' + data.msg);
      setTimeout(refreshList, 3000);
    }

    async function disconnect(service) {
      if (!confirm('确定断开连接？')) return;
      const data = await fetchJson('/api/wifi/disconnect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ service })
      });
      setTimeout(refreshList, 2000);
    }

    refreshList();
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
