<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>拼接日志</title>
  <style>
    :root { --bg:#09090b; --card:#18181b; --border:#303035; --text:#f5f5f5; --muted:#a1a1aa; --accent:#0a84ff; --good:#30d158; --bad:#ff453a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
    header { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:rgba(9,9,11,.94); border-bottom:1px solid var(--border); }
    h1 { margin:0; font-size:21px; } a, button { color:#fff; text-decoration:none; } button { border:0; border-radius:8px; padding:8px 11px; background:var(--accent); font-size:14px; font-weight:700; }
    main { max-width:960px; margin:0 auto; padding:14px; }
    .empty { margin-top:28px; text-align:center; color:var(--muted); }
    .log-card { border:1px solid var(--border); border-radius:14px; background:var(--card); margin-bottom:12px; overflow:hidden; }
    .log-title { display:flex; justify-content:space-between; gap:12px; width:100%; padding:14px; text-align:left; background:transparent; border-radius:0; }
    .log-title .small { display:block; color:var(--muted); font-size:12px; margin-top:5px; font-weight:400; }
    .status { flex:0 0 auto; font-size:13px; } .success { color:var(--good); } .failed { color:var(--bad); }
    .detail { display:none; border-top:1px solid var(--border); padding:14px; } .detail.open { display:block; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; margin-bottom:14px; }
    .metric { padding:10px; border-radius:9px; background:#242428; } .metric label { display:block; color:var(--muted); font-size:12px; } .metric strong { display:block; margin-top:4px; font-size:16px; }
    h2 { margin:16px 0 8px; font-size:15px; } table { width:100%; border-collapse:collapse; font-size:13px; } th,td { padding:8px; border-bottom:1px solid #303035; text-align:left; vertical-align:top; } th { color:var(--muted); font-weight:600; }
    pre { margin:0; padding:10px; overflow:auto; background:#09090b; border-radius:8px; color:#d4d4d8; font-size:12px; line-height:1.45; }
    .note { color:var(--muted); font-size:12px; line-height:1.5; }
  </style>
</head>
<body>
  <header><a href="stitch.html">← 拼接</a><h1>详细拼接日志</h1><button onclick="loadLogs()">刷新</button></header>
  <main id="logs"><div class="empty">正在读取本次服务运行中的拼接记录…</div></main>
  <script>
    const root = document.getElementById('logs');
    const ms = value => value == null ? '不可用' : Number(value).toFixed(1) + ' ms';
    const percent = value => value == null ? '不可用' : Number(value).toFixed(1) + '%';
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const stageRows = report => {
      const stages = [...(report.stages || []), ...((report.engine_detail || {}).stages || [])];
      return stages.map(stage => `<tr><td>${esc(stage.name)}</td><td>${ms(stage.elapsed_ms)}</td><td><pre>${esc(JSON.stringify(Object.fromEntries(Object.entries(stage).filter(([key]) => !['name','elapsed_ms'].includes(key))), null, 2))}</pre></td></tr>`).join('') || '<tr><td colspan="3">本引擎未提供可分阶段数据</td></tr>';
    };
    const card = (report, forceOpen) => {
      const resources = report.resources || {};
      const input = report.input || {};
      const detail = report.engine_detail || {};
      const reportId = esc(report.id);
      return `<section class="log-card"><button class="log-title" onclick="toggle('${reportId}')"><span><strong>${esc(report.started_at || report.id)}</strong><span class="small">${esc(report.source || 'image')} · ${esc(input.count || 0)} 张输入 · ${esc((detail.engine || report.config?.requested_engine || 'unknown'))}</span></span><span class="status ${esc(report.status)}">${report.status === 'success' ? '成功' : '失败'}</span></button><div id="detail-${reportId}" class="detail ${forceOpen ? 'open' : ''}"><div class="summary"><div class="metric"><label>总耗时</label><strong>${ms(report.total_elapsed_ms)}</strong></div><div class="metric"><label>系统 CPU（区间均值）</label><strong>${percent(resources.system_cpu_percent_approx)}</strong></div><div class="metric"><label>后端 CPU 容量占用</label><strong>${percent(resources.backend_process_cpu_capacity_percent_approx)}</strong></div><div class="metric"><label>输出尺寸</label><strong>${esc((report.output || {}).width || '-') } × ${esc((report.output || {}).height || '-')}</strong></div></div><h2>输入与输出</h2><pre>${esc(JSON.stringify({input: report.input, output: report.output, message: report.message}, null, 2))}</pre><h2>阶段耗时、参数与特征数据</h2><table><thead><tr><th>阶段</th><th>耗时</th><th>参数 / 结果</th></tr></thead><tbody>${stageRows(report)}</tbody></table><h2>引擎、加速与资源快照</h2><pre>${esc(JSON.stringify({config: report.config, engine_detail: detail, resources: resources}, null, 2))}</pre><p class="note">GPU 数据只读取系统安全暴露的 devfreq/sysfs 计数器；内核未提供时显示为空，不会伪造占用率。日志仅保留当前后端进程最近 30 次拼接，服务重启后清空。</p></div></section>`;
    };
    function toggle(id) { document.getElementById('detail-' + id).classList.toggle('open'); }
    async function loadLogs() {
      const id = new URLSearchParams(location.search).get('id');
      const response = await fetch('/api/stitch/logs' + (id ? '?id=' + encodeURIComponent(id) : ''), {cache:'no-store'});
      const data = await response.json().catch(() => ({}));
      const reports = data.report ? [data.report] : (data.reports || []);
      root.innerHTML = reports.length ? reports.map((report, index) => card(report, Boolean(id) || index === 0)).join('') : '<div class="empty">还没有拼接记录。完成一次图片或相机拼接后，这里会显示详细数据。</div>';
    }
    loadLogs();
  </script>
</body>
</html>
