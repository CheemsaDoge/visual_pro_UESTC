<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">GUI 极简真实关系图</title>
  <desc id="desc">按当前代码关系简化后的 RK3588 GUI 架构图，仅保留 backend.py、routes、camera_service、stitch_service 以及预览、拼接、系统和 Wi-Fi API 的关键连接。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #fcfcfd; stroke: #d0d5dd; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #253243; stroke-width: 2.4; }
      .accent { fill: #eef4ff; stroke: #2457d6; stroke-width: 2.2; }
      .runtime { fill: #edfdf3; stroke: #027a48; stroke-width: 2.2; }
      .status { fill: #f5f3ff; stroke: #6941c6; stroke-width: 2.2; }
      .wifi { fill: #ecfeff; stroke: #0e7490; stroke-width: 2.2; }
      .title { font: 700 20px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #101828; }
      .subtitle { font: 400 13px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #475467; }
      .panel-title { font: 700 22px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #101828; }
      .box-title { font: 700 18px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #101828; }
      .body { font: 400 13px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #344054; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.8; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #667085; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowSoft); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#344054"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="760"/>

  <text class="title" x="28" y="38">当前 GUI 后端真实关系图（极简）</text>
  <text class="subtitle" x="28" y="60">纠正点只记 3 个：预览流直连 backend.py；FramePacket 在 camera_service 链路内；system / wifi 还留在 routes 里做逻辑。</text>

  <rect class="panel" x="24" y="86" rx="18" ry="18" width="200" height="630"/>
  <rect class="panel" x="244" y="86" rx="18" ry="18" width="300" height="630"/>
  <rect class="panel" x="564" y="86" rx="18" ry="18" width="320" height="630"/>
  <rect class="panel" x="904" y="86" rx="18" ry="18" width="572" height="630"/>

  <text class="panel-title" x="48" y="128">前端</text>
  <text class="panel-title" x="268" y="128">入口与路由</text>
  <text class="panel-title" x="588" y="128">业务模块</text>
  <text class="panel-title" x="928" y="128">结果</text>

  <rect class="card" x="56" y="198" rx="12" ry="12" width="136" height="148"/>
  <text class="box-title" x="124" y="236" text-anchor="middle">页面</text>
  <text class="body" x="84" y="268">index.html</text>
  <text class="body" x="84" y="292">stitch.html</text>
  <text class="body" x="84" y="316">wifi.html</text>

  <rect class="accent" x="298" y="148" rx="12" ry="12" width="192" height="92"/>
  <text class="box-title" x="394" y="186" text-anchor="middle">backend.py</text>
  <text class="body" x="332" y="214">HTTP + static + preview</text>

  <rect class="card" x="288" y="294" rx="12" ry="12" width="212" height="84"/>
  <text class="box-title" x="394" y="334" text-anchor="middle">camera_routes</text>
  <text class="body" x="342" y="358">status / start / stop</text>

  <rect class="card" x="288" y="408" rx="12" ry="12" width="212" height="84"/>
  <text class="box-title" x="394" y="448" text-anchor="middle">stitch_routes</text>
  <text class="body" x="338" y="472">image / status / list</text>

  <rect class="wifi" x="288" y="524" rx="12" ry="12" width="212" height="108"/>
  <text class="box-title" x="394" y="562" text-anchor="middle">system_routes + wifi_routes</text>
  <text class="body" x="326" y="588">system cmd / ConnMan</text>
  <text class="body" x="326" y="612">仍在 routes 内处理</text>

  <rect class="runtime" x="618" y="224" rx="12" ry="12" width="212" height="120"/>
  <text class="box-title" x="724" y="262" text-anchor="middle">camera_service</text>
  <text class="body" x="648" y="290">capture → FramePacket</text>
  <text class="body" x="648" y="314">→ preprocess → runtime</text>

  <rect class="accent" x="618" y="430" rx="12" ry="12" width="212" height="132"/>
  <text class="box-title" x="724" y="468" text-anchor="middle">stitch_service</text>
  <text class="body" x="648" y="496">storage_service</text>
  <text class="body" x="648" y="520">StitchEngine + GeometryEngine</text>

  <rect class="status" x="966" y="170" rx="12" ry="12" width="448" height="116"/>
  <text class="box-title" x="1190" y="208" text-anchor="middle">相机预览 / 相机状态</text>
  <text class="body" x="1000" y="236">preview: backend.py 直接处理</text>
  <text class="body" x="1000" y="260">status: camera_routes → camera_service</text>

  <rect class="accent" x="966" y="372" rx="12" ry="12" width="448" height="96"/>
  <text class="box-title" x="1190" y="410" text-anchor="middle">拼接输出</text>
  <text class="body" x="1000" y="438">stitched_*.jpg</text>

  <rect class="wifi" x="966" y="540" rx="12" ry="12" width="448" height="108"/>
  <text class="box-title" x="1190" y="578" text-anchor="middle">系统 / Wi-Fi API</text>
  <text class="body" x="1000" y="606">/api/status / /api/config/public / /api/wifi/*</text>

  <path class="arrow" d="M192 272 H298"/>
  <path class="arrow" d="M394 240 V294"/>
  <path class="arrow" d="M500 336 H618"/>
  <path class="arrow" d="M500 450 H618"/>
  <path class="arrow" d="M500 578 H966"/>
  <path class="arrow" d="M830 284 H966"/>
  <path class="arrow" d="M830 478 H966"/>

  <path class="arrow-soft" d="M490 194 H966"/>
  <path class="arrow-soft" d="M830 320 H890 V420 H966"/>
</svg>
